# Entorno para generar el sitio con Zensical (https://zensical.org).
#   uv sync                 # una vez: crea .venv/ con las versiones de uv.lock
#   uv run zensical serve   # previsualizar en http://localhost:8000
[project]
name = "introduccion-bioinformatica-site"
version = "2026.11"
description = "Sitio web del curso (introduccion_bioinformatica), generado con Zensical"
authors = [{ name = "Fernán Agüero", email = "fernan@iib.unsam.edu.ar" }]
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "zensical==0.1.0",
    # 3.11.3 rompe toc con data-toc-label sin valor (ver zensical-migration DECISIONS D13)
    "markdown!=3.11.3",
]

[tool.uv]
package = false
